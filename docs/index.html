<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="description" content="Simple Minimalist Linktree Page" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://byanderraw.github.io" />

    <!-- Browser UI Color - Matches the default light/dark theme backgrounds -->
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"

    <meta
      name="theme-color"
      content="#121212"
      media="(prefers-color-scheme: dark)"
    />

    <meta property="og:title" content="Adrian Alexander Salgado" />
